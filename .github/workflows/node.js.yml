name: Node.js CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep older downstream runtimes covered as well as modern Node releases.
        node-version: [12.x, 14.x, 16.x, 18.x, 20.x, 22.x, 24.x]
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: npm
    - run: npm ci
    - run: npm run ci
    - name: Save coverage
      if: matrix.node-version == '24.x'
      uses: actions/upload-artifact@v4
      with:
        name: coverage
        path: coverage/

  types:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24.x
        cache: npm
        cache-dependency-path: test/types/package-lock.json
    - run: npm ci --prefix test/types
    - run: npm run test:types
