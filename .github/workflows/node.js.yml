name: Node.js CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep older downstream runtimes covered as well as modern Node releases.
        node-version: [12.x, 14.x, 16.x, 18.x, 20.x, 22.x, 24.x]
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: npm
    - run: npm ci
    - run: npm run ci
    - name: Upload coverage to Codecov
      if: matrix.node-version == '24.x'
      uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      with:
        files: coverage/lcov.info
        disable_search: true
        fail_ci_if_error: true
    - name: Save coverage
      if: matrix.node-version == '24.x'
      uses: actions/upload-artifact@v4
      with:
        name: coverage
        path: coverage/

  fresh-dependencies:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [12.x, 14.x, 16.x, 18.x, 20.x, 22.x, 24.x]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    # A clean checkout has no node_modules or hidden install lockfile.
    # Ignore the committed lockfile and resolve the declared dependency ranges.
    - run: npm install --package-lock=false
    - run: npm run ci

  koa3:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 24.x]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: npm
    - run: npm ci
    - run: npm install --no-save --package-lock=false koa@3.0.1
    - run: npm run ci
    - name: Check Koa 3 type declarations
      run: |
        npm ci --prefix test/types
        npm install --prefix test/types --no-save --package-lock=false @types/koa@3.0.3
        npm run test:types
    - name: Check the Koa 3 TypeScript sample
      run: |
        npm install --prefix samples/ts --package-lock=false
        npm exec --prefix samples/ts -- tsc --project samples/ts/tsconfig.json --noEmit

  types:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24.x
        cache: npm
        cache-dependency-path: test/types/package-lock.json
    - run: npm ci --prefix test/types
    - run: npm run test:types
